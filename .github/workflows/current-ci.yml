name: Current project CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  current-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Install project
        run: python -m pip install --no-cache-dir -e ".[test,rl]"
      - name: Current regression suite
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Source verification
        run: python scripts/verify_project.py
      - name: Diff hygiene
        run: git diff --check
