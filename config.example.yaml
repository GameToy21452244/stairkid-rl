game:
  exe_path: "請使用者填入完整 exe 路徑"
  window_title_contains: "請使用者填入部分視窗標題"
  window_class_name: null
  auto_launch: false
  launch_wait_seconds: 3.0

capture:
  mode: "client_area"
  left: null
  top: null
  width: null
  height: null
  target_fps: 15
  resize_width: 320
  resize_height: 480
  grayscale: false

controls:
  left_key: "left"
  right_key: "right"
  restart_key: "enter"
  pause_key: null
  action_duration_ms: 80
  # 同方向可跨 observation 持續按住；若控制迴圈卡住，500 ms 後 watchdog 自動放鍵。
  max_continuous_hold_ms: 500
  restart_duration_ms: 200
  menu_focus_correction_key: null
  input_backend: "pyautogui"

safety:
  emergency_stop_key: "f8"
  require_foreground_window: true
  release_keys_on_error: true
  block_on_related_windows: true

diagnostics:
  save_debug_frames: true
  show_fps: true
  draw_capture_border: true

detection:
  dialog_template_path: "captures/templates/dialog.png"
  dialog_roi_left: null
  dialog_roi_top: null
  dialog_roi_width: null
  dialog_roi_height: null
  reference_width: null
  reference_height: null
  dialog_threshold: 0.80
  search_margin: 8
  menu_start_button_left: null
  menu_start_button_top: null
  menu_start_button_width: null
  menu_start_button_height: null
  menu_two_player_button_left: null
  menu_two_player_button_top: null
  menu_two_player_button_width: null
  menu_two_player_button_height: null
  menu_exit_button_left: null
  menu_exit_button_top: null
  menu_exit_button_width: null
  menu_exit_button_height: null
  menu_focus_border_mean_max: 180.0
  menu_focus_minimum_contrast: 20.0
  menu_focus_inner_gray_max: 80
  menu_focus_inner_dark_ratio_min: 0.20

vision:
  playfield_left: null
  playfield_top: null
  playfield_width: null
  playfield_height: null
  reference_width: null
  reference_height: null
  player_hue_max: 40
  player_saturation_min: 140
  player_value_min: 170
  player_min_width: 15
  player_max_width: 50
  player_min_height: 14
  player_max_height: 50
  player_dilate_width: 7
  player_dilate_height: 9
  player_close_kernel_size: 3
  player_min_colored_pixels: 12
  normal_platform_template_path: "captures/templates/platform_normal.png"
  normal_platform_threshold: 0.90
  spikes_platform_template_path: "captures/templates/platform_spikes.png"
  spikes_platform_threshold: 0.90
  green_platform_template_path: "captures/templates/platform_green.png"
  green_platform_template_paths: []
  green_platform_threshold: 0.90
  metal_platform_template_path: "captures/templates/platform_metal.png"
  metal_platform_template_paths: []
  metal_platform_threshold: 0.90
  flipping_platform_template_paths: []
  flipping_platform_threshold: 0.90

hud:
  reference_width: null
  reference_height: null
  life_left: null
  life_top: null
  life_segment_width: 6
  life_segment_height: 14
  life_segment_pitch: 8
  life_max_segments: 12
  life_red_min: 170
  life_green_min: 100
  life_blue_max: 100
  life_filled_ratio: 0.50
  # 需由實機 HUD 校正；全為 null 時 floor counter 明確標示 unavailable。
  floor_counter_left: null
  floor_counter_top: null
  floor_counter_width: null
  floor_counter_height: null
  floor_counter_initial_value: 1
  floor_binary_threshold: 120
  # 2026-08-03 real-video calibration: HUD 5->6 differs by about 2.985%.
  floor_change_ratio_threshold: 0.025
  floor_stability_ratio_threshold: 0.02
  floor_change_required_consecutive: 2

events:
  landing_contact_gap: 6
  spring_contact_gap: 12
  correlation_frames: 5

environment:
  max_episode_steps: 3000
  floor_reward: 1.0
  step_penalty: 0.01
  direction_change_penalty: 0.02
  direction_change_window_steps: 2
  spike_dwell_penalty: 0.03
  spike_dwell_grace_steps: 2
  spike_contact_max_gap: 12
  idle_action_penalty: 0.02
  idle_action_grace_steps: 2
  platform_dwell_penalty: 0.02
  platform_dwell_grace_steps: 12
  platform_dwell_max_gap: 80
  top_danger_penalty: 0.03
  top_danger_grace_steps: 2
  top_danger_y_ratio: 0.33
  wall_margin_pixels: 32
  wall_push_penalty: 0.08
  platform_alignment_reward_scale: 0.5
  platform_target_action_reward: 0.05
  platform_alignment_min_vertical_gap: 25
  platform_alignment_max_vertical_gap: 260
  platform_alignment_landing_margin: 10
  platform_alignment_rising_origin_exclusion_gap: 150
  platform_alignment_safe_kinds:
    - "normal"
    - "spring"
    - "conveyor"
    - "flipping"
  damage_penalty_per_segment: 0.2
  death_penalty: 5.0
  velocity_scale: 500.0
  max_platforms_per_type: 8
  auto_restart_on_reset: false
  reset_required_consecutive_frames: 3
  reset_max_observation_frames: 30
  reset_focus_max_observation_frames: 24
  reset_focus_correction_max_observation_frames: 12
  reset_focus_correction_max_presses: 3
  reset_post_action_delay_seconds: 0.4
  max_observation_platforms: 8
  observation_history_frames: 4
  include_action_history: true

training:
  algorithm: "ppo"
  total_timesteps: 1024
  max_episodes: 3
  max_training_seconds: 120.0
  n_steps: 128
  batch_size: 64
  n_epochs: 4
  learning_rate: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.03
  target_kl: 0.01
  seed: 2
  device: "cpu"
  checkpoint_freq_steps: 256
  model_dir: "models/ppo"
  policy_hidden_sizes:
    - 128
    - 128

baseline:
  max_episode_steps: 300
  max_episode_seconds: 30.0
  horizontal_deadzone_pixels: 12.0
  min_target_vertical_gap_pixels: 25.0
  max_target_vertical_gap_pixels: 260.0
  hazard_vertical_gap_pixels: 180.0
  hazard_horizontal_margin_pixels: 64.0
  direction_switch_release_frames: 1
  rising_origin_exclusion_gap_pixels: 150.0
  rising_origin_horizontal_margin_pixels: 12.0
  target_reacquire_distance_pixels: 80.0
  landing_margin_pixels: 10.0
  reachability_base_pixels: 70.0
  reachability_per_vertical_pixel: 0.8
  launch_platform_vertical_gap_pixels: 30.0
  launch_escape_clearance_pixels: 16.0
  launch_commit_max_steps: 3
  launch_replan_cooldown_steps: 2
  support_departure_max_steps: 8
  support_departure_lost_frames: 1
  support_departure_abort_cooldown_steps: 2
  post_launch_coast_frames: 2
  landing_velocity_lookahead_seconds: 0.25
  landing_prediction_max_seconds: 0.55
  landing_release_projection_seconds: 0.05
  landing_vertical_speed_floor_pixels_per_second: 80.0
  special_escape_edge_guard_pixels: 12.0
  special_escape_outward_velocity_threshold_pixels_per_second: 40.0
  special_contact_direction_commit_steps: 3
  special_contact_destination_stability_steps: 2
  special_contact_replan_limit: 1
  special_contact_forced_exit_steps: 4
  special_contact_reacquire_center_tolerance_pixels: 32.0
  fallback_center_x_pixels: 231.5
  top_danger_player_y_threshold: 140.0
  top_pressure_memory_steps: 4
  top_pressure_dropout_continue_steps: 2
  top_pressure_support_settle_steps: 2
  deep_landing_horizontal_cost: 0.75
  emergency_spike_min_health_segments: 6
  recovery_full_health_segments: 12
  special_contact_escape_max_steps: 12
  aligned_platform_dwell_escape_steps: 4
  aligned_platform_dwell_gap_tolerance_pixels: 3.0
  playfield_left_pixels: 40.0
  playfield_right_pixels: 423.0
  wall_guard_margin_pixels: 32.0
  wall_guard_velocity_lookahead_seconds: 0.20
  wall_evacuation_exit_margin_pixels: 64.0
  wall_evacuation_cooldown_steps: 4
  safe_platform_kinds:
    - normal
    - spring
    - conveyor
    - flipping
