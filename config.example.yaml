game:
  exe_path: "請使用者填入完整 exe 路徑"
  window_title_contains: "請使用者填入部分視窗標題"
  window_class_name: null
  auto_launch: false
  launch_wait_seconds: 3.0

capture:
  mode: "client_area"
  left: null
  top: null
  width: null
  height: null
  target_fps: 15
  resize_width: 320
  resize_height: 480
  grayscale: false

controls:
  left_key: "left"
  right_key: "right"
  restart_key: "enter"
  pause_key: null
  action_duration_ms: 80
  restart_duration_ms: 200
  input_backend: "pyautogui"

safety:
  emergency_stop_key: "f8"
  require_foreground_window: true
  release_keys_on_error: true
  block_on_related_windows: true

diagnostics:
  save_debug_frames: true
  show_fps: true
  draw_capture_border: true

detection:
  dialog_template_path: "captures/templates/dialog.png"
  dialog_roi_left: null
  dialog_roi_top: null
  dialog_roi_width: null
  dialog_roi_height: null
  reference_width: null
  reference_height: null
  dialog_threshold: 0.80
  search_margin: 8
  menu_start_button_left: null
  menu_start_button_top: null
  menu_start_button_width: null
  menu_start_button_height: null
  menu_two_player_button_left: null
  menu_two_player_button_top: null
  menu_two_player_button_width: null
  menu_two_player_button_height: null
  menu_focus_border_mean_max: 180.0
  menu_focus_minimum_contrast: 20.0
  menu_focus_inner_gray_max: 80
  menu_focus_inner_dark_ratio_min: 0.20

vision:
  playfield_left: null
  playfield_top: null
  playfield_width: null
  playfield_height: null
  reference_width: null
  reference_height: null
  player_hue_max: 40
  player_saturation_min: 140
  player_value_min: 170
  player_min_width: 15
  player_max_width: 50
  player_min_height: 15
  player_max_height: 50
  player_dilate_width: 7
  player_dilate_height: 9
  normal_platform_template_path: "captures/templates/platform_normal.png"
  normal_platform_threshold: 0.90
  spikes_platform_template_path: "captures/templates/platform_spikes.png"
  spikes_platform_threshold: 0.90
  green_platform_template_path: "captures/templates/platform_green.png"
  green_platform_template_paths: []
  green_platform_threshold: 0.90
  metal_platform_template_path: "captures/templates/platform_metal.png"
  metal_platform_template_paths: []
  metal_platform_threshold: 0.90
  flipping_platform_template_paths: []
  flipping_platform_threshold: 0.90

hud:
  reference_width: null
  reference_height: null
  life_left: null
  life_top: null
  life_segment_width: 6
  life_segment_height: 14
  life_segment_pitch: 8
  life_max_segments: 12
  life_red_min: 170
  life_green_min: 100
  life_blue_max: 100
  life_filled_ratio: 0.50

events:
  landing_contact_gap: 6
  spring_contact_gap: 12
  correlation_frames: 5

environment:
  max_episode_steps: 3000
  floor_reward: 1.0
  step_penalty: 0.01
  damage_penalty_per_segment: 0.2
  death_penalty: 5.0
  velocity_scale: 500.0
  max_platforms_per_type: 8
  auto_restart_on_reset: false
  reset_required_consecutive_frames: 3
  reset_max_observation_frames: 30
  reset_post_action_delay_seconds: 0.4
  max_observation_platforms: 8
  observation_history_frames: 4
  include_action_history: true

training:
  algorithm: "ppo"
  total_timesteps: 1024
  max_episodes: 3
  max_training_seconds: 120.0
  n_steps: 128
  batch_size: 64
  n_epochs: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  seed: 42
  device: "cpu"
  checkpoint_freq_steps: 256
  model_dir: "models/ppo"
  policy_hidden_sizes:
    - 128
    - 128

baseline:
  max_episode_steps: 300
  max_episode_seconds: 30.0
  horizontal_deadzone_pixels: 12.0
  min_target_vertical_gap_pixels: 25.0
  max_target_vertical_gap_pixels: 260.0
  hazard_vertical_gap_pixels: 180.0
  hazard_horizontal_margin_pixels: 64.0
  direction_switch_release_frames: 1
  rising_origin_exclusion_gap_pixels: 150.0
  rising_origin_horizontal_margin_pixels: 12.0
  target_reacquire_distance_pixels: 80.0
  landing_margin_pixels: 10.0
  reachability_base_pixels: 70.0
  reachability_per_vertical_pixel: 0.8
  launch_platform_vertical_gap_pixels: 30.0
  launch_escape_clearance_pixels: 16.0
  post_launch_coast_frames: 2
  fallback_center_x_pixels: 231.5
  top_danger_player_y_threshold: 140.0
  deep_landing_horizontal_cost: 0.75
  emergency_spike_min_health_segments: 6
  safe_platform_kinds:
    - normal
    - spring
    - conveyor
    - flipping
