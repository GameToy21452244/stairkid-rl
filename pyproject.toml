[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stair-agent"
version = "0.1.0"
description = "以螢幕擷取與一般鍵盤輸入控制 NS-SHAFT 的安全介面層"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mss>=9.0,<11",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PyAutoGUI>=0.9.54,<1",
  "PyDirectInput>=1.0.4,<2",
  "pywin32>=306",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
