[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "stairkid-rl"
version = "0.1.0"
description = "NS-SHAFT simulator, verified PPO runtime, and guarded Real interface"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mss>=9.0,<11",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "PyAutoGUI>=0.9.54,<1; platform_system == 'Windows'",
  "PyDirectInput>=1.0.4,<2; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
  "PyYAML>=6.0,<7",
  "gymnasium>=1.0,<2",
  "pymunk>=6.8,<8",
  "pygame-ce>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]
rl = [
  "torch==2.8.0",
  "stable-baselines3==2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
