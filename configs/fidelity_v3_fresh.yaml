fresh_curriculum:
  stage_a:
    end_timesteps: 196608
    schedule_cycle: [ordinary]
    description: learn V3 from random initialization without snapshot curriculum
  stage_b:
    end_timesteps: 393216
    schedule_cycle: [ordinary, ordinary, ordinary, ordinary, ordinary, ordinary, failure, success]
    description: 75 percent ordinary plus self-generated failure/success snapshots
  stage_c:
    end_timesteps: 655360
    schedule_cycle: [ordinary, ordinary, failure, success]
    description: full 50/25/25 V3 using freshly regenerated self-curriculum
  bank_target_per_class: 48
  bank_collection_max_episodes: 256
  failure_snapshot_lookback_steps: 3
  success_min_floor: 5
  success_snapshots_max_per_episode: 3
