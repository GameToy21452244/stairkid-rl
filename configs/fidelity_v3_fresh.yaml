    release_deceleration: [912.0, 1008.0]
    reverse_brake_multiplier: [1.0, 1.08]
    max_horizontal_speed: [224.0, 236.0]
    gravity: [-489.6, -470.4]
    max_fall_speed: [529.0, 551.0]
  observation:
    player_position_jitter_px: 1.0
    platform_position_jitter_px: 1.0
